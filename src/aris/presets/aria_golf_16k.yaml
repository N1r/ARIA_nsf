# ARIA-GOLF: GOLF source-filter with analytic VocalTractCascade end_filter.
#
# Analytic params:  alpha (tilt), F1/B1, F2/B2
# Learned params:   n_learned=6 biquad sections (F3..F8 region)
# Total AR order:   1 + 2 + 2 + 6×2 = 17  (vs. 18 for plain GOLF)
#
# Controlled manipulation:
#   model.decoder.end_filter.get_formant_params(ctrl)  →  {alpha, f1, b1, f2, b2}

decoder:
  class_path: aris.models.sf.SourceFilterSynth
  init_args:
    harm_oscillator:
      class_path: aris.models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: aris.models.noise.StandardNormalNoise
    noise_filter:
      class_path: aris.models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128
    end_filter:
      class_path: aris.models.analytic_filter.VocalTractCascade
      init_args:
        sr: 16000
        n_learned: 6
        f1_range: [150, 1300]
        f2_range: [600, 3200]
    room_filter:
      class_path: aris.models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
