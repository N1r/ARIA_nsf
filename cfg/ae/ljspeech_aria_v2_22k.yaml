# ARIA-GOLF v2 @ 22.05kHz on LJSpeech 1h.
# Use with: --model cfg/ae/decoder/aria_golf_v2_22k.yaml
seed_everything: 42
trainer:
  max_steps: 40000
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 5
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        monitor: val_loss
        save_on_train_epoch_end: false
        filename: "{epoch}-{step}-{val_loss:.3f}"
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: train_loss
        patience: 3000
        mode: min
        check_finite: true
        check_on_train_epoch_end: true
model:
  class_path: ltng.ae.VoiceAutoEncoder
  init_args:
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 80.0
      f0_max: 600.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 1024
      hop_length: 220
      channels: [32, 64, 128, 256]
      strides: [4, 4, 4, 4]
      lstm_hidden_size: 256
      num_layers: 3
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    decoder: null
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts: [509, 1021, 2053]
        alpha: 1.0
        window: hanning
        center: true
    sample_rate: 22050
    detach_voicing: true
    detach_f0: true
    train_with_true_f0: true
    formant_loss_weight: 1.5
    residual_reg_weight: 0.02
ckpt_path: null
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 32
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/ljspeech_1h
    duration: 1.5
    overlap: 1.0
    val_ratio: 0.05
    sample_rate: 22050
    augment: false
    load_formants: true
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0002
