# ARIA-GOLF v3 + GAN v3 finetune @ 24kHz (CSMSC).
# warm-start from csmsc_aria_v3 checkpoint (aria_golf_v3 decoder, with tilt + supervision).
# Use with: --model cfg/ae/decoder/aria_golf_v3_24k.yaml
seed_everything: 42
trainer:
  max_steps: 30000
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 10
  gradient_clip_val: null
  strategy: auto
  accelerator: gpu
  devices: 1
  logger:
    - class_path: swanlab.integration.pytorch_lightning.SwanLabLogger
      init_args:
        project: aria-gan-v3
        experiment_name: csmsc_g3v3
        mode: offline
        logdir: /zfsstore/user/dingyr/golf/runs/swanlab
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: /zfsstore/user/dingyr/golf/runs/csmsc_gan3_v3
        name: csv
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        every_n_train_steps: 5000
        save_top_k: -1
        filename: "{epoch}-{step}"
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        save_top_k: 2
        filename: "best-{epoch}-{step}-{val_loss:.3f}"
        save_on_train_epoch_end: false
model:
  class_path: ltng.ae_gan.VoiceAutoEncoderGAN
  init_args:
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 80.0
      f0_max: 600.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 1024
      hop_length: 240
      channels: [32, 64, 128, 256]
      strides: [4, 4, 4, 4]
      lstm_hidden_size: 256
      num_layers: 3
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    decoder: null
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts: [127, 255, 511, 1023, 2047]
        alpha: 1.0
        window: hanning
        center: true
    sample_rate: 24000
    detach_voicing: true
    detach_f0: true
    train_with_true_f0: true
    formant_loss_weight: 2.0
    formant_smooth_weight: 0.05
    residual_reg_weight: 0.02
    discriminator:
      class_path: models.discriminator.MultiScaleSpectrogramDiscriminator
      init_args:
        nscales: 6
        features: [32, 64, 128, 256]
    wave_discriminators:
      - class_path: models.discriminator.MultiPeriodDiscriminator
        init_args:
          periods: [2, 3, 5, 7, 11]
          channels: [32, 128, 256, 512]
      - class_path: models.discriminator.MultiScaleSTFTDiscriminator
        init_args:
          configs:
            - [1024, 256]
            - [2048, 512]
            - [512,  128]
            - [256,   64]
          features: [32, 64, 128, 256]
      - class_path: models.discriminator.MultiScaleCQTDiscriminator
        init_args:
          sr: 24000
          n_bins: 84
          fmin: 32.7
          bins_per_octave: 12
          hop_lengths: [256, 512, 1024]
          n_bands: 7
          features: [32, 64, 128]
    adv_weight: 1.0
    fm_weight: 2.0
    mel_weight: 8.0
    mel_n_fft: 1024
    mel_hop: 256
    mel_n_mels: 80
    gen_lr: 0.0001
    disc_lr: 0.0001
    lr_decay: 0.999
    gan_start_step: 0
    grad_clip: 0.5
    real_label_min: 0.9
    real_label_max: 1.0
    generator_ckpt: null  # filled by slurm script
ckpt_path: null
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 12
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/csmsc_1h
    duration: 1.5
    overlap: 1.0
    val_ratio: 0.05
    sample_rate: 24000
    augment: false
    load_formants: true
