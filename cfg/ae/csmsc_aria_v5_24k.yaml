# ARIA-GOLF v5 (5h subset, full-recipe) @ 24kHz on CSMSC-1h.
# vs v2: use_tilt restored; formant_loss_weight 2.0 (↑ from 1.5); formant_smooth_weight 0.05 (new);
#        wider MSSLoss n_ffts for better formant coverage.
seed_everything: 42
trainer:
  # batch 64 + 20k steps == same data passes as batch 32 + 40k, ~2x faster wall-clock
  # (LPC kernel parallelism = batch dim; GPU was underutilized at 32)
  max_steps: 80000
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 20
  gradient_clip_val: 0.5
  strategy: auto
  accelerator: gpu
  devices: 1
  logger:
    - class_path: swanlab.integration.pytorch_lightning.SwanLabLogger
      init_args:
        project: aria-aperiodicity
        experiment_name: csmsc_v5
        mode: offline
        logdir: /zfsstore/user/dingyr/golf/runs/swanlab
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: /zfsstore/user/dingyr/golf/runs/csmsc_aria_v5
        name: csv
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        monitor: val_loss
        save_on_train_epoch_end: false
        filename: "{epoch}-{step}-{val_loss:.3f}"
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: train_loss
        patience: 2000
        mode: min
        check_finite: true
        check_on_train_epoch_end: true
model:
  class_path: ltng.ae.VoiceAutoEncoder
  init_args:
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 80.0
      f0_max: 500.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 1024
      hop_length: 240
      channels: [32, 64, 128, 256]
      strides: [4, 4, 4, 4]
      lstm_hidden_size: 256
      num_layers: 3
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    decoder: null
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts: [127, 255, 511, 1023, 2047]
        alpha: 1.0
        window: hanning
        center: true
    sample_rate: 24000
    detach_voicing: true
    detach_f0: true
    train_with_true_f0: true
    formant_loss_weight: 2.0
    residual_reg_weight: 0.02
    formant_smooth_weight: 0.05
ckpt_path: null
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 64
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/csmsc_5h
    duration: 2.0
    overlap: 0.5
    val_ratio: 0.05
    sample_rate: 24000
    augment: false
    load_formants: true
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0002
