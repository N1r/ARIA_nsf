seed_everything: 42
trainer:
  max_steps: 200000
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 5
  gradient_clip_val: 0.5
  strategy: auto
  accelerator: gpu
  devices: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        monitor: val_loss
        save_on_train_epoch_end: false
        filename: "{epoch}-{step}-{val_loss:.3f}"
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: train_loss
        patience: 3000
        mode: min
        check_finite: true
        check_on_train_epoch_end: true
model:
  class_path: ltng.ae.VoiceAutoEncoder
  init_args:
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 100.0
      f0_max: 500.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 512          # 16kHz: 512 ≈ 32ms
      hop_length: 160     # 16kHz: 160 = 10ms
      channels:
        - 32
        - 64
        - 128
        - 256
      strides:
        - 4
        - 4
        - 4
        - 4
      lstm_hidden_size: 256
      num_layers: 3
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    decoder: null          # 由 --model decoder/*.yaml 覆盖
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts:
          - 255
          - 511
          - 1023
        alpha: 1.0
        window: hanning
        center: true
    sample_rate: 16000
    voicing_loss_weight: 1.0
    f0_loss_weight: 1.0
    detach_voicing: true
    detach_f0: true
    train_with_true_f0: true
ckpt_path: null
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 64
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/F024
    duration: 1.5
    overlap: 1.0
    val_ratio: 0.05
    sample_rate: 16000
    augment: false
    f0_scale_range: [0.7, 1.3]
    tilt_alpha_range: [-0.12, 0.12]
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0002
