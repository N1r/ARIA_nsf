# ARIA-GOLF v2 @ 24kHz on CSMSC 1h.
# Use with: --model cfg/ae/decoder/aria_golf_v2_24k.yaml
#
# Differences vs mandarin_csmsc_24k.yaml (ARIA v1):
#   decoder  → aria_golf_v2_24k (use_tilt=False, tighter BW, Mandarin F1/F2 ranges, n_learned=9)
#   formant_loss_weight  0.5 → 1.5   (stronger F1/F2 supervision; supervised setting works well)
#   residual_reg_weight  0.005 → 0.02 (penalize learned biquads harder → force analytic poles to do the work)
#
# Rationale:
#   - alpha/tilt couples with F1 amplitude and log_gain; removing it cleanses the F1/F2 axes
#   - narrower BW range closes the "boost amplitude via high-Q pole" escape hatch
#   - stronger supervision + residual reg together push the encoder to rely on analytic F1/F2
seed_everything: 42
trainer:
  max_steps: 40000
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 5
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        monitor: val_loss
        save_on_train_epoch_end: false
        filename: "{epoch}-{step}-{val_loss:.3f}"
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: train_loss
        patience: 3000
        mode: min
        check_finite: true
        check_on_train_epoch_end: true
model:
  class_path: ltng.ae.VoiceAutoEncoder
  init_args:
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 80.0
      f0_max: 600.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 1024
      hop_length: 240
      channels: [32, 64, 128, 256]
      strides: [4, 4, 4, 4]
      lstm_hidden_size: 256
      num_layers: 3
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    decoder: null          # override with --model cfg/ae/decoder/aria_golf_v2_24k.yaml
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts: [509, 1021, 2053]
        alpha: 1.0
        window: hanning
        center: true
    sample_rate: 24000
    detach_voicing: true
    detach_f0: true
    train_with_true_f0: true
    formant_loss_weight: 1.5
    residual_reg_weight: 0.02
ckpt_path: null
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 32
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/csmsc_1h
    duration: 1.5
    overlap: 1.0
    val_ratio: 0.05
    sample_rate: 24000
    augment: false
    load_formants: true
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0002
