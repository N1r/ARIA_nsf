# ARIA-GOLF + EXCITATION FLOW finetune @ 24kHz (CSMSC).
# Stage-2 warm-start: freeze aria_golf backbone, train an ExcitationFlow head that maps
# the glottal prior x0 -> true excitation x1 (inverse-filtered speech). The flow-vs-GAN
# comparison leg. Use:
#   --config cfg/ae/csmsc_flow_24k.yaml --model cfg/ae/decoder/aria_golf_24k.yaml
#   --model.generator_ckpt <csmsc aria_golf best>
seed_everything: 42
trainer:
  max_steps: 30000
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 10
  gradient_clip_val: 1.0
  accelerator: gpu
  devices: 1
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        monitor: val_loss
        save_top_k: 3
        filename: "{epoch}-{step}-{val_loss:.4f}"
model:
  class_path: ltng.ae_flow.VoiceAutoEncoderFlow
  init_args:
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 80.0
      f0_max: 600.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 1024
      hop_length: 240
      channels: [32, 64, 128, 256]
      strides: [4, 4, 4, 4]
      lstm_hidden_size: 256
      num_layers: 3
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    decoder: null
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts: [509, 1021, 2053]
        alpha: 1.0
        window: hanning
        center: true
    sample_rate: 24000
    detach_voicing: true
    detach_f0: true
    train_with_true_f0: true
    flow:
      class_path: models.flow.ExcitationFlow
      init_args:
        cond_dim: 2
        channels: 64
        n_layers: 8
        kernel: 5
    flow_lr: 0.0002
    flow_steps: 4
    freeze_backbone: true
    generator_ckpt: null
ckpt_path: null
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 12
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/csmsc_1h
    duration: 1.5
    overlap: 1.0
    val_ratio: 0.05
    sample_rate: 24000
    augment: false
    load_formants: true
