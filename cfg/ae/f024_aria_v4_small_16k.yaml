# ARIA-GOLF v4 SMALL encoder @ 16kHz on F024 — model-size ablation (smaller encoder).
# Use with: --model cfg/ae/decoder/aria_golf_v4_16k.yaml
seed_everything: 42
trainer:
  max_steps: 40000
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 20
  gradient_clip_val: 0.5
  strategy: auto
  accelerator: gpu
  devices: 1
  logger:
    - class_path: swanlab.integration.pytorch_lightning.SwanLabLogger
      init_args:
        project: aria-aperiodicity
        experiment_name: f024_v4_small
        mode: offline
        logdir: /zfsstore/user/dingyr/golf/runs/swanlab
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: /zfsstore/user/dingyr/golf/runs/f024_aria_v4_small
        name: csv
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        save_last: true
        monitor: val_loss
        save_on_train_epoch_end: false
        filename: "{epoch}-{step}-{val_loss:.3f}"
        save_top_k: 3
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: train_loss
        patience: 2000
        mode: min
        check_finite: true
        check_on_train_epoch_end: true
model:
  class_path: ltng.ae.VoiceAutoEncoder
  init_args:
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 100.0
      f0_max: 500.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 512
      hop_length: 160
      channels: [16, 32, 64, 128]
      strides: [4, 4, 4, 4]
      lstm_hidden_size: 128
      num_layers: 2
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    decoder: null
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts: [127, 255, 511, 1023]
        alpha: 1.0
        window: hanning
        center: true
    sample_rate: 16000
    detach_voicing: true
    detach_f0: true
    train_with_true_f0: true
    formant_loss_weight: 2.0
    residual_reg_weight: 0.02
    formant_smooth_weight: 0.05
ckpt_path: null
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 128
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/F024
    duration: 1.5
    overlap: 1.0
    val_ratio: 0.05
    sample_rate: 16000
    augment: false
    load_formants: true
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0002
