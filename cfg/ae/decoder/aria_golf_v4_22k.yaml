# ARIA-GOLF v4 decoder (v3 + decoupled band-aperiodicity head) @ 22050 Hz — tilt restored, tighter BW/F ranges.
# LPC order: 2*(1+2+8) = 22
decoder:
  class_path: models.sf.SourceFilterSynthAP
  init_args:
    harm_oscillator:
      class_path: models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 256
    aperiodicity_filter:
      class_path: models.filters.AperiodicityFIRFilter
      init_args:
        window: hanning
        n_mag: 256
        hf_bias: 2.0   # -2 at DC -> +2 at Nyquist: HF starts noise-dominated
    end_filter:
      class_path: models.analytic_filter.VocalTractCascade
      init_args:
        sr: 22050
        n_learned: 8
        use_tilt: true
        # F ranges = v1; must cover 1.3x max data F1 to avoid manipulation clipping
        f1_range: [150, 1300]
        f2_range: [600, 3200]
        b1_range: [50, 200]
        b2_range: [50, 250]
    room_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
