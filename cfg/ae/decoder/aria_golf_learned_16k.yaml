# ABLATION: identical to aria_golf_16k but the formant (F,B)→pole map is a small MLP
# (learned_placement: true) instead of the analytic r=exp(-pi*B/sr), theta=2*pi*F/sr.
# Same F1/F2 control handle; isolates the contribution of the analytic poles. Train with
# formant supervision so the learned map has a target (cf. cfg/ae/mandarin_f024_sup.yaml).

decoder:
  class_path: models.sf.SourceFilterSynth
  init_args:
    harm_oscillator:
      class_path: models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128
    end_filter:
      class_path: models.analytic_filter.VocalTractCascade
      init_args:
        sr: 16000
        n_learned: 6
        f1_range: [150, 1300]
        f2_range: [600, 3200]
        learned_placement: true
    room_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
