# ARIA-DDSP: DDSP H+N with analytic AnalyticHarmonicsOscillator.
#
# Replaces AdditiveSynthesizer: each harmonic amplitude is shaped by
#   log A_k = log|H_F1| + log|H_F2| + log|G_tilt| + residual_k
#
# Analytic params:  alpha (tilt), F1/B1, F2/B2  (5 logits)
# Learned residual: 80 per-harmonic correction scalars
# Total:            85 logits  (vs. 80 for plain DDSP)
#
# Controlled manipulation:
#   model.decoder.harm_oscillator.get_formant_params(ctrl)  →  {alpha, f1, b1, f2, b2}

decoder:
  class_path: models.hpn.HarmonicPlusNoiseSynth
  init_args:
    harm_oscillator:
      class_path: models.analytic_filter.AnalyticHarmonicsOscillator
      init_args:
        sr: 16000
        n_harmonics: 80
        f1_range: [150, 1000]
        f2_range: [600, 3200]
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    harm_filter:
      class_path: models.ctrl.PassThrough
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128
    end_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
