# GOLF-ss (sample-wise), adapted for 16kHz
# lpc_order: 18 (sr/1000 + 2 = 18 for 16kHz; was 22 for 24kHz)
# window_length in noise_filter: 640 (was 960 for 24kHz; ~40ms at 16kHz)
decoder:
  class_path: models.sf.SourceFilterSynth
  init_args:
    harm_oscillator:
      class_path: models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128          # 16kHz: 128 bins
    end_filter:
      class_path: models.filters.LTVMinimumPhaseFilterPrecise
      init_args:
        lpc_order: 18
        lpc_parameterisation: rc2lpc
    room_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
