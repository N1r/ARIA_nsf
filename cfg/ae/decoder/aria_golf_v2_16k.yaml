# ARIA-GOLF v2 decoder @ 16kHz — no tilt, tighter BW, configurable formant ranges.
# v1 (with tilt, n_learned=6): 2*(1+2+6)=18  → v2 (no tilt, n_learned=7): 2*(2+7)=18  same order
decoder:
  class_path: models.sf.SourceFilterSynth
  init_args:
    harm_oscillator:
      class_path: models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128
    end_filter:
      class_path: models.analytic_filter.VocalTractCascade
      init_args:
        sr: 16000
        n_learned: 7
        use_tilt: false
        f1_range: [200, 1000]
        f2_range: [700, 3000]
        b1_range: [50, 200]
        b2_range: [50, 250]
    room_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
