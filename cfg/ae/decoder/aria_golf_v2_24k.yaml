# ARIA-GOLF v2 decoder @ 24kHz — no tilt, tighter BW ranges, Mandarin F1/F2 priors.
#
# Changes vs aria_golf_24k.yaml:
#   use_tilt=False   — removes 1st-order tilt pole (alpha); breaks alpha↔F1 amplitude coupling
#   b1_range=[50,200], b2_range=[50,250]  — narrower BW; closes the "adjust BW to fake amplitude" path
#   f1_range=[200,900], f2_range=[700,2800]  — tighter Mandarin vowel priors; sharpens sigmoid sensitivity
#   n_learned=9  — compensates for the removed tilt pole, keeps LPC order=2*(2+9)=22
#
# n_ctrl breakdown: [log_gain, f1, b1, f2, b2] + 9×2 learned = 5+18 = 23
# LPC order: 2*(n_formants + n_learned) = 2*(2+9) = 22
#   v1 with tilt: 2*(1_tilt + 2_formants + 8_learned) = 2*11 = 22
#   v2 no  tilt : 2*(        2_formants + 9_learned)  = 2*11 = 22  ← n_learned +1 compensates
decoder:
  class_path: models.sf.SourceFilterSynth
  init_args:
    harm_oscillator:
      class_path: models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 256
    end_filter:
      class_path: models.analytic_filter.VocalTractCascade
      init_args:
        sr: 24000
        n_learned: 9
        use_tilt: false
        f1_range: [200, 900]
        f2_range: [700, 2800]
        b1_range: [50, 200]
        b2_range: [50, 250]
    room_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
