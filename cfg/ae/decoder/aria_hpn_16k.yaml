# ARIA-HPN: H+N synthesis with VocalTractCascade as harm_filter.
#
# Architecture:
#   harm_osc  = AdditiveSynthesizer (flat-spectrum harmonics)
#   harm_filter = VocalTractCascade (all-pole formant shaping of harmonics)
#   noise_filter = LTVZeroPhaseFIRFilter (noise spectral envelope)
#   end_filter   = LTIAcousticFilter (room)
#
# This keeps the DDSP H+N backward path clean: cascade only acts on the
# harmonic signal, not on harm_osc+noise, avoiding SourceFilterSynth
# backward coupling to the glottal flow table.

decoder:
  class_path: models.hpn.HarmonicPlusNoiseSynth
  init_args:
    harm_oscillator:
      class_path: models.synth.AdditiveSynthesizer
      init_args:
        num_harmonics: 80
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    harm_filter:
      class_path: models.analytic_filter.VocalTractCascade
      init_args:
        sr: 16000
        n_learned: 6
        f1_range: [150, 1000]
        f2_range: [600, 3200]
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128
    end_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
