# ARIA-GOLF decoder @ 24kHz (CSMSC) — F3 variant. Same AR order 22 as aria_golf_24k
# (order = 2*(1 + n_formants + n_learned) = 2*(1+3+7) = 22): one learned pole is traded
# for a controllable analytic F3 (rhotic / erhua / fine vowel contrasts).
decoder:
  class_path: models.sf.SourceFilterSynth
  init_args:
    harm_oscillator:
      class_path: models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: models.noise.StandardNormalNoise
    noise_filter:
      class_path: models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 256
    end_filter:
      class_path: models.analytic_filter.VocalTractCascade
      init_args:
        sr: 24000
        n_learned: 7
        n_formants: 3
        f1_range: [150, 1300]
        f2_range: [600, 3200]
        f3_range: [1800, 4000]
    room_filter:
      class_path: models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
