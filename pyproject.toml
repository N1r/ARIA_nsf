[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aris"
version = "0.1.0"
description = "Prepare data, train differentiable vocoders, and generate manipulated speech stimuli"
readme = "README_EN.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "ARIS contributors"}]
keywords = ["audio", "ddsp", "phonetics", "speech", "voice-synthesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  "numpy>=1.23,<3",
]

[project.optional-dependencies]
audio = [
  "soundfile>=0.12",
  "scipy>=1.9",
]
world = ["pyworld>=0.3.4"]
visualize = ["matplotlib>=3.6"]
train = [
  "torch==2.4.1",
  "torchaudio==2.4.1",
  "lightning[pytorch-extra]>=2.1,<3",
  "jsonargparse[signatures]>=4.27",
  "omegaconf>=2.3",
  "soundfile>=0.12",
  "scipy>=1.9",
  "tqdm>=4.65",
  "kazane",
  "torch-fftconv",
  "diffsptk",
  "numba>=0.57",
  "pyloudnorm",
  "PyYAML>=5.4",
  "soxr",
  "torchlpc",
]
dev = ["pytest>=7", "ruff>=0.5", "build>=1"]

[project.urls]
Repository = "https://github.com/N1r/ARIS_nsf"
Demo = "https://n1r.github.io/ARIS_nsf/"

[project.scripts]
aris = "aris.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aris = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100
# Vendored GOLF engine code (kept checkpoint-compatible, not linted historically).
extend-exclude = ["src/aris/models", "src/aris/training", "src/aris/losses"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
