[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phonlab-ddsp"
version = "0.1.0"
description = "Reproducible DDSP experiments and acoustic visualisation for phoneticians"
readme = "README_EN.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "PhonLab-DDSP contributors"}]
keywords = ["audio", "ddsp", "phonetics", "speech", "voice-synthesis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
]
dependencies = [
  "numpy>=1.23,<3",
]

[project.optional-dependencies]
audio = [
  "soundfile>=0.12",
  "scipy>=1.9",
]
world = ["pyworld>=0.3.4"]
visualize = ["matplotlib>=3.6"]
train = [
  "torch==2.4.1+cu124",
  "torchaudio==2.4.1+cu124",
  "lightning[pytorch-extra]>=2.1,<3",
  "jsonargparse[signatures]>=4.27",
  "omegaconf>=2.3",
  "soundfile>=0.12",
  "scipy>=1.9",
  "tqdm>=4.65",
  "kazane",
  "torch-fftconv",
  "diffsptk",
  "numba>=0.57",
  "pyloudnorm",
  "PyYAML>=5.4",
  "soxr",
  "torchlpc",
]
dev = ["pytest>=7", "ruff>=0.5", "build>=1"]

[project.scripts]
phonlab-ddsp = "phonlab_ddsp.cli:main"
phonlab = "phonlab_ddsp.cli:main"

[tool.setuptools]
packages = [
  "phonlab_ddsp",
  "phonlab_ddsp.controls",
  "phonlab_ddsp.presets",
  "models",
  "models.audiotensor",
  "models.lru",
  "ltng",
  "loss",
]
py-modules = ["autoencode"]
package-dir = {phonlab_ddsp = "src/phonlab_ddsp"}
include-package-data = true

[tool.setuptools.package-data]
phonlab_ddsp = ["presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = {index = "pytorch-cu124"}
torchaudio = {index = "pytorch-cu124"}
