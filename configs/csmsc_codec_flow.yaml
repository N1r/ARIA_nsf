seed_everything: 42
trainer:
  accelerator: gpu
  devices: 1
  max_steps: 30000
  check_val_every_n_epoch: 10
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  num_sanity_val_steps: 0
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      filename: '{epoch}-{step}-{val_loss:.4f}'
      monitor: val_loss
      save_last: true
      save_top_k: 3
      mode: min
  default_root_dir: /zfsstore/user/dingyr/golf/runs/csmsc_codec_flow
model:
  class_path: ltng.ae_codec_flow.VoiceAutoEncoderCodecFlow
  init_args:
    codec_flow:
      class_path: models.codec_flow.CodecFlowEnhancer
      init_args:
        n_channels: 128    # EnCodec encoder output dim
        inner: 256
        n_layers: 8
        kernel: 5
    codec_flow_lr: 0.0002
    flow_steps: 8
    encodec_bandwidth: 6.0
    generator_ckpt: runs/csmsc_aria_golf/checkpoints/epoch=279-step=39200-val_loss=3.109.ckpt
    freeze_backbone: true
    decoder:
      class_path: models.sf.SourceFilterSynth
      init_args:
        harm_oscillator:
          class_path: models.synth.DownsampledIndexedGlottalFlowTable
          init_args:
            hop_rate: 10
            in_channels: 64
            oversampling: 4
            equal_energy: true
            table_size: 100
            table_type: derivative
            normalize_method: constant_power
            align_peak: true
            trainable: false
            min_R_d: 0.3
            max_R_d: 2.7
            lf_v2: true
            points: 2048
        noise_generator:
          class_path: models.noise.StandardNormalNoise
        noise_filter:
          class_path: models.filters.LTVZeroPhaseFIRFilter
          init_args:
            window: hanning
            conv_method: direct
            n_mag: 256
        end_filter:
          class_path: models.analytic_filter.VocalTractCascade
          init_args:
            sr: 24000
            n_learned: 8
            f1_range: [150, 1300]
            f2_range: [600, 3200]
            n_formants: 2
            max_abs_pole: 0.99
        room_filter:
          class_path: models.filters.LTIAcousticFilter
          init_args:
            length: 128
            conv_method: fft
        subtract_harmonics: false
    criterion:
      class_path: loss.spec.MSSLoss
      init_args:
        n_ffts: [509, 1021, 2053]
        alpha: 1.0
        ratio: 1.0
        overlap: 0.75
        window: hanning
    encoder_class_path: models.enc.VocoderParameterEncoderInterface
    encoder_init_args:
      f0_min: 80.0
      f0_max: 600.0
      backbone_type: models.unet.UNetEncoder
      n_fft: 1024
      hop_length: 240
      channels: [32, 64, 128, 256]
      strides: [4, 4, 4, 4]
      lstm_hidden_size: 256
      num_layers: 3
      dropout: 0.1
      learn_voicing: false
      learn_f0: false
    sample_rate: 24000
    detach_f0: true
    detach_voicing: true
    train_with_true_f0: true
    f0_loss_weight: 1.0
    voicing_loss_weight: 1.0
    formant_loss_weight: 0.0
    residual_reg_weight: 0.0
data:
  class_path: ltng.data.SingleSpeaker
  init_args:
    batch_size: 12
    wav_dir: /zfsstore/user/dingyr/data1/speech_synthesis/csmsc_1h
    duration: 1.5
    overlap: 1.0
    f0_suffix: .pv
    val_ratio: 0.05
    sample_rate: 24000
    augment: false
    load_formants: true
