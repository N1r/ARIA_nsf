# ARIA-GOLF v7 decoder @ 16kHz — v3 + pole-zero (ARMA) vocal tract (n_zeros=2).
# end_filter = VocalTractCascadeARMA: adds 2 conjugate anti-formant zeros (controllable
# nasalisation), applied via philtorch.lpv.lfilter. n_zeros=0 would equal v3 exactly.
# LPC order: 2*(1+2+6) = 18  (same as v1 16k)
decoder:
  class_path: aris.models.sf.SourceFilterSynth
  init_args:
    harm_oscillator:
      class_path: aris.models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: aris.models.noise.StandardNormalNoise
    noise_filter:
      class_path: aris.models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128
    end_filter:
      class_path: aris.models.analytic_filter.VocalTractCascadeARMA
      init_args:
        sr: 16000
        n_learned: 6
        use_tilt: true
        # F ranges = v1; must cover 1.3x max data F1 to avoid manipulation clipping
        f1_range: [150, 1300]
        f2_range: [600, 3200]
        b1_range: [50, 200]
        b2_range: [50, 250]
        n_zeros: 2
        nasal_fz_range: [700, 2500]   # anti-formant centre (Hz)
        nasal_bz_range: [40, 600]     # anti-formant bandwidth → notch depth
    room_filter:
      class_path: aris.models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
    subtract_harmonics: false
