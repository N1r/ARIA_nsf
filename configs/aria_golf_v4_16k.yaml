# ARIA-GOLF v4 decoder @ 16kHz — v3 + explicit decoupled band-aperiodicity head.
# vs v3: SourceFilterSynthAP instead of SourceFilterSynth; adds aperiodicity_filter
#        A(f) in [0,1] (sigmoid, HF-rising prior). src = (I-A)*harm + A*noise_filter(noise).
# noise_filter keeps unbounded exp magnitude (noise spectral envelope); A does the mix.
# LPC order: 2*(1+2+6) = 18  (same as v1/v3 16k)
decoder:
  class_path: aris.models.sf.SourceFilterSynthAP
  init_args:
    harm_oscillator:
      class_path: aris.models.synth.DownsampledIndexedGlottalFlowTable
      init_args:
        hop_rate: 10
        in_channels: 64
        oversampling: 4
        equal_energy: true
        table_type: derivative
        normalize_method: constant_power
        align_peak: true
        trainable: false
        min_R_d: 0.3
        max_R_d: 2.7
        lf_v2: true
        points: 2048
    noise_generator:
      class_path: aris.models.noise.StandardNormalNoise
    noise_filter:
      class_path: aris.models.filters.LTVZeroPhaseFIRFilter
      init_args:
        window: hanning
        n_mag: 128
    aperiodicity_filter:
      class_path: aris.models.filters.AperiodicityFIRFilter
      init_args:
        window: hanning
        n_mag: 128
        hf_bias: 2.0   # -2 at DC -> +2 at Nyquist: HF starts noise-dominated
    end_filter:
      class_path: aris.models.analytic_filter.VocalTractCascade
      init_args:
        sr: 16000
        n_learned: 6
        use_tilt: true
        # F ranges = v1; must cover 1.3x max data F1 to avoid manipulation clipping
        f1_range: [150, 1300]
        f2_range: [600, 3200]
        b1_range: [50, 200]
        b2_range: [50, 250]
    room_filter:
      class_path: aris.models.filters.LTIAcousticFilter
      init_args:
        length: 128
        conv_method: fft
